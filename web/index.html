<script>
  /* Set the theme before anything paints, so there is never a flash of the wrong theme. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('ks-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
